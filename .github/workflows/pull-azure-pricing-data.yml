name: Pull Azure Pricing Data

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

concurrency:
  group: pull-azure-pricing-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh supported Azure regions
    runs-on: ubuntu-latest
    environment: dev
    env:
      TCO_CALCULATOR_URL: ${{ vars.TCO_CALCULATOR_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refresh Azure price snapshots
        shell: pwsh
        run: ./.github/scripts/Refresh-AzurePricing.ps1
