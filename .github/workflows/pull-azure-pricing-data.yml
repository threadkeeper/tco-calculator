name: Pull Azure Pricing Data

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

concurrency:
  group: pull-azure-pricing-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh supported Azure regions
    runs-on: ubuntu-latest
    environment: dev
    env:
      TCO_CALCULATOR_URL: ${{ vars.TCO_CALCULATOR_URL }}
    steps:
      - name: Refresh Azure price snapshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TCO_CALCULATOR_URL)) {
            throw 'GitHub environment dev is missing TCO_CALCULATOR_URL.'
          }
          $origin = $null
          if (-not [Uri]::TryCreate($env:TCO_CALCULATOR_URL, [UriKind]::Absolute, [ref]$origin) -or
              $origin.Scheme -ne 'https' -or
              -not [string]::IsNullOrEmpty($origin.Query) -or
              -not [string]::IsNullOrEmpty($origin.Fragment)) {
            throw 'TCO_CALCULATOR_URL must be an absolute HTTPS URL without a query or fragment.'
          }

          $catalogEndpoint = [Uri]::new($origin, '/api/v1/catalog/azure/regions')
          $refreshEndpoint = [Uri]::new($origin, '/api/v1/pricing/azure/refresh')
          try {
            $catalog = Invoke-RestMethod -Uri $catalogEndpoint -Method Get -TimeoutSec 60
          }
          catch {
            throw "Unable to load the supported Azure region catalog: $($_.Exception.Message)"
          }

          $regions = @($catalog.items | ForEach-Object { $_.code } | Where-Object {
            -not [string]::IsNullOrWhiteSpace($_)
          } | Sort-Object -Unique)
          if ($regions.Count -eq 0) {
            throw 'The supported Azure region catalog is empty.'
          }

          $failures = [System.Collections.Generic.List[string]]::new()
          $refreshed = [System.Collections.Generic.List[string]]::new()
          foreach ($region in $regions) {
            $body = @{
              aws_region = $null
              azure_region = $region
              currency = 'USD'
              resources = @()
            } | ConvertTo-Json -Compress

            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-RestMethod `
                  -Uri $refreshEndpoint `
                  -Method Post `
                  -ContentType 'application/json' `
                  -Body $body `
                  -TimeoutSec 180
                if ($response.status -ne 'fresh' -or [string]::IsNullOrWhiteSpace($response.snapshot_id)) {
                  $warnings = @($response.warnings) -join ' | '
                  throw "Refresh returned status '$($response.status)'. $warnings"
                }
                $refreshed.Add($region)
                Write-Output "Refreshed $region at $($response.retrieved_at)."
                $lastError = $null
                break
              }
              catch {
                $lastError = $_.Exception.Message
                Write-Warning "Azure pricing refresh attempt $attempt for $region failed: $lastError"
                if ($attempt -lt 3) {
                  Start-Sleep -Seconds (5 * $attempt)
                }
              }
            }

            if ($null -ne $lastError) {
              $failures.Add("${region}: $lastError")
              Write-Output "::warning title=Azure pricing refresh failed::$region could not be refreshed after 3 attempts."
            }
          }

          @(
            '## Azure pricing refresh'
            ''
            "- Supported regions: $($regions.Count)"
            "- Refreshed: $($refreshed.Count)"
            "- Failed: $($failures.Count)"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($refreshed.Count -gt 0) {
            "- Successful regions: $($refreshed -join ', ')" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          if ($failures.Count -gt 0) {
            '' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            '### Failures' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            $failures | ForEach-Object { "- $_" } | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            throw "$($failures.Count) of $($regions.Count) Azure regions failed to refresh."
          }
