name: Pull AWS Pricing Data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: pull-aws-pricing-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh supported AWS regions
    runs-on: ubuntu-latest
    environment: dev
    env:
      TCO_CALCULATOR_URL: ${{ vars.TCO_CALCULATOR_URL }}
    steps:
      - name: Refresh AWS price snapshots
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TCO_CALCULATOR_URL)) {
            throw 'GitHub environment dev is missing TCO_CALCULATOR_URL.'
          }
          $origin = $null
          if (-not [Uri]::TryCreate($env:TCO_CALCULATOR_URL, [UriKind]::Absolute, [ref]$origin) -or
              $origin.Scheme -ne 'https' -or
              -not [string]::IsNullOrEmpty($origin.Query) -or
              -not [string]::IsNullOrEmpty($origin.Fragment)) {
            throw 'TCO_CALCULATOR_URL must be an absolute HTTPS URL without a query or fragment.'
          }

          $endpoint = [Uri]::new($origin, '/api/v1/pricing/aws/refresh')
          $regions = @(
            'eu-central-1',
            'eu-central-2',
            'eu-north-1',
            'eu-south-1',
            'eu-south-2',
            'eu-west-1',
            'eu-west-2',
            'eu-west-3'
          )

          foreach ($region in $regions) {
            $body = @{
              aws_region = $region
              azure_region = 'swedencentral'
              currency = 'USD'
              resources = @()
            } | ConvertTo-Json -Compress
            $response = Invoke-RestMethod `
              -Uri $endpoint `
              -Method Post `
              -ContentType 'application/json' `
              -Body $body `
              -TimeoutSec 180
            if ($response.status -ne 'fresh' -or [string]::IsNullOrWhiteSpace($response.snapshot_id)) {
              throw "AWS pricing refresh for $region did not produce a fresh snapshot."
            }
            Write-Output "Refreshed $region at $($response.retrieved_at)."
          }