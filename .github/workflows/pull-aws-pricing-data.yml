name: Pull AWS Pricing Data

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: pull-aws-pricing-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh supported regions
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 240
    env:
      TCO_CALCULATOR_URL: ${{ vars.TCO_CALCULATOR_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refresh AWS price snapshots
        shell: pwsh
        run: ./.github/scripts/Refresh-AwsPricing.ps1 -MaxAttemptsPerRegion 3 -MaxRetainedSnapshots 2
