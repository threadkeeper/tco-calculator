openapi: 3.1.0
info:
  title: Azure SQL TCO API
  version: 0.1.0
  description: >-
    Server-authoritative API for estimating AWS and on-premises SQL Server costs
    against Azure SQL Managed Instance. Results are estimates, not quotes.
servers:
  - url: /api/v1
tags:
  - name: Session
  - name: Privacy
  - name: Assistant
  - name: Catalogs
  - name: Pricing
  - name: Calculations
  - name: Projects
  - name: Project Shares
paths:
  /session:
    get:
      operationId: getSession
      tags: [Session]
      responses:
        '200':
          description: Current guest or authenticated principal summary.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /privacy-consent:
    put:
      operationId: savePrivacyConsent
      tags: [Privacy]
      security:
        - containerAppsAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePrivacyConsentRequest'
      responses:
        '200':
          description: Current owner-scoped privacy acceptance and contact preference.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyConsentStatus'
        default:
          $ref: '#/components/responses/Problem'
  /assistant/help:
    post:
      operationId: getAssistantHelp
      tags: [Assistant]
      summary: Answer a question from the reviewed application-help catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantHelpRequest'
      responses:
        '200':
          description: Deterministic application help with matched control references.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantHelpResponse'
        default:
          $ref: '#/components/responses/Problem'
  /assistant/turn:
    post:
      operationId: runAssistantTurn
      tags: [Assistant]
      summary: Run one bounded tool-enabled assistant turn for the signed-in owner.
      security:
        - containerAppsAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantTurnRequest'
      responses:
        '200':
          description: Plain-text assistant answer grounded in allowlisted application tools.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTurnResponse'
        default:
          $ref: '#/components/responses/Problem'
  /assistant/image:
    post:
      operationId: analyzeAssistantImage
      tags: [Assistant]
      summary: Normalize one JPEG or PNG and return a validated project proposal.
      security:
        - containerAppsAuth: []
      parameters:
        - name: x-tco-project-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Optional owner-scoped saved project selected by the host. When absent, the agent may stage a new unsaved browser draft.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              maxLength: 10485760
          image/png:
            schema:
              type: string
              format: binary
              maxLength: 10485760
      responses:
        '200':
          description: A request-scoped, validated patch or new browser-draft proposal. No image or project is saved.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantImageResponse'
        default:
          $ref: '#/components/responses/Problem'
  /assistant/actions:
    post:
      operationId: executeAssistantAction
      tags: [Assistant]
      summary: Apply one explicitly confirmed project patch through the normal project service.
      security:
        - containerAppsAuth: []
      parameters:
        - name: x-tco-action-confirmation
          in: header
          required: true
          schema:
            type: string
            const: apply_project_patch
          description: Dedicated same-origin browser confirmation, separate from natural-language intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantActionRequest'
      responses:
        '200':
          description: Authoritative owner-scoped project after the atomic update and verification read.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /catalog/aws/regions:
    get:
      operationId: listAwsRegions
      tags: [Catalogs]
      responses:
        '200':
          description: Supported AWS source regions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionCatalog'
  /catalog/azure/regions:
    get:
      operationId: listAzureRegions
      tags: [Catalogs]
      responses:
        '200':
          description: Supported Azure target regions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionCatalog'
  /catalog/aws/ec2/instances:
    get:
      operationId: listEc2Instances
      tags: [Catalogs]
      parameters:
        - $ref: '#/components/parameters/AwsRegion'
      responses:
        '200':
          description: EC2 instance metadata available in the latest regional snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ec2InstanceCatalog'
        default:
          $ref: '#/components/responses/Problem'
  /catalog/aws/rds/instances:
    get:
      operationId: listRdsInstances
      tags: [Catalogs]
      parameters:
        - $ref: '#/components/parameters/AwsRegion'
      responses:
        '200':
          description: RDS instance metadata available in the latest regional snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdsInstanceCatalog'
        default:
          $ref: '#/components/responses/Problem'
  /catalog/aws/rds/options:
    get:
      operationId: listRdsOptions
      tags: [Catalogs]
      parameters:
        - $ref: '#/components/parameters/AwsRegion'
        - name: instance_type
          in: query
          required: true
          schema:
            type: string
        - name: deployment
          in: query
          required: true
          schema:
            type: string
            enum: [single_az, multi_az]
      responses:
        '200':
          description: Commercial and storage options available for the selected RDS shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdsOptionCatalog'
        default:
          $ref: '#/components/responses/Problem'
  /catalog/aws/ebs/types:
    get:
      operationId: listEbsTypes
      tags: [Catalogs]
      parameters:
        - $ref: '#/components/parameters/AwsRegion'
      responses:
        '200':
          description: EBS volume types and local pricing availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EbsTypeCatalog'
        default:
          $ref: '#/components/responses/Problem'
  /catalog/azure/mi/purchase-options:
    get:
      operationId: listPurchaseOptions
      tags: [Catalogs]
      responses:
        '200':
          description: Supported Azure SQL MI purchase options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOptionCatalog'
  /pricing/aws/resolve:
    post:
      operationId: resolveAwsPrices
      tags: [Pricing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceResolutionRequest'
      responses:
        '200':
          description: AWS snapshot status, including normal unavailable outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResolution'
        default:
          $ref: '#/components/responses/Problem'
  /pricing/aws/refresh:
    post:
      operationId: refreshAwsPrices
      tags: [Pricing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceResolutionRequest'
      responses:
        '200':
          description: Forced AWS live-resolution outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResolution'
        default:
          $ref: '#/components/responses/Problem'
  /pricing/azure/resolve:
    post:
      operationId: resolveAzurePrices
      tags: [Pricing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceResolutionRequest'
      responses:
        '200':
          description: Azure snapshot status, including normal unavailable outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResolution'
        default:
          $ref: '#/components/responses/Problem'
  /pricing/azure/refresh:
    post:
      operationId: refreshAzurePrices
      tags: [Pricing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceResolutionRequest'
      responses:
        '200':
          description: Forced Azure live-resolution outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResolution'
        default:
          $ref: '#/components/responses/Problem'
  /calculations:
    post:
      operationId: calculateProject
      tags: [Calculations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
      responses:
        '200':
          description: Server-owned calculation revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationRevision'
        default:
          $ref: '#/components/responses/Problem'
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      security:
        - containerAppsAuth: []
      responses:
        '200':
          description: Projects owned by the current principal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProject
      tags: [Projects]
      security:
        - containerAppsAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditableProject'
      responses:
        '201':
          description: Created owner-scoped project.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      security:
        - containerAppsAuth: []
      responses:
        '200':
          description: Owner-scoped project.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateProject
      tags: [Projects]
      security:
        - containerAppsAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditableProject'
      responses:
        '200':
          description: Updated owner-scoped project.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProject
      tags: [Projects]
      security:
        - containerAppsAuth: []
      responses:
        '204':
          description: Project deleted immediately.
        default:
          $ref: '#/components/responses/Problem'
  /projects/{project_id}/shares:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createProjectShare
      tags: [Project Shares]
      security:
        - containerAppsAuth: []
      responses:
        '201':
          description: A reusable project-share credential that expires after 30 days.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedProjectShare'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{project_id}/shares/{share_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ShareId'
    delete:
      operationId: revokeProjectShare
      tags: [Project Shares]
      security:
        - containerAppsAuth: []
      responses:
        '204':
          description: Project share revoked.
        default:
          $ref: '#/components/responses/Problem'
  /project-shares/resolve:
    post:
      operationId: resolveProjectShare
      tags: [Project Shares]
      security:
        - containerAppsAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectShareCredentials'
      responses:
        '200':
          description: Editable project snapshot with no source ownership metadata or revision.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableProject'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    containerAppsAuth:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration
      description: Authentication is enforced by Azure Container Apps built-in authentication.
  parameters:
    AwsRegion:
      name: region
      in: query
      required: true
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 Problem Details response.
      headers:
        Retry-After:
          description: Seconds to wait when the request quota is exceeded.
          schema:
            type: string
        ETag:
          description: Current project ETag after a failed precondition.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      examples: ['8760', '0.10', '12345.67']
    ResolutionStatus:
      type: string
      enum: [fresh, cached, stale, unavailable]
    Session:
      type: object
      required: [mode, display_name, email_address, privacy_consent]
      properties:
        mode:
          type: string
          enum: [guest, authenticated]
        display_name:
          type: [string, 'null']
        email_address:
          type: [string, 'null']
          format: email
          description: Optional email-like value supplied by the identity provider for contact-form prefill only.
        privacy_consent:
          $ref: '#/components/schemas/PrivacyConsentStatus'
    PrivacyConsentStatus:
      type: object
      required: [notice_version, required, accepted_at, allow_contact, email_address]
      properties:
        notice_version:
          type: string
        required:
          type: boolean
        accepted_at:
          type: [string, 'null']
          format: date-time
        allow_contact:
          type: boolean
        email_address:
          type: [string, 'null']
          format: email
          description: Stored only when Azure SQL contact permission is enabled.
    SavePrivacyConsentRequest:
      type: object
      additionalProperties: false
      required: [notice_version, accepted, allow_contact, email_address]
      properties:
        notice_version:
          type: string
        accepted:
          type: boolean
          const: true
        allow_contact:
          type: boolean
        email_address:
          type: [string, 'null']
          format: email
    AssistantHelpRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
    AssistantHelpResponse:
      type: object
      additionalProperties: false
      required: [answer, references]
      properties:
        answer:
          type: string
        references:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/AssistantHelpReference'
    AssistantHelpReference:
      type: object
      additionalProperties: false
      required: [control_id, label]
      properties:
        control_id:
          type: string
        label:
          type: string
    AssistantTurnRequest:
      type: object
      additionalProperties: false
      required: [question, project_id]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
        project_id:
          type: [string, 'null']
          format: uuid
          description: Optional owner-scoped saved project selected by the host for this turn.
    AssistantTurnResponse:
      type: object
      additionalProperties: false
      required: [answer, references, proposal]
      properties:
        answer:
          type: string
        references:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/AssistantHelpReference'
        proposal:
          oneOf:
            - $ref: '#/components/schemas/AssistantProposal'
            - type: 'null'
    AssistantAction:
      type: string
      enum: [apply_project_patch]
    AssistantProjectPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 500
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        resources:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Resource'
    AssistantProjectPatchChange:
      type: object
      additionalProperties: false
      required: [pointer, before, after]
      properties:
        pointer:
          type: string
        before: {}
        after: {}
    AssistantProjectPatchProposal:
      type: object
      additionalProperties: false
      required: [proposal_id, action, project_id, expected_etag, patch, changes]
      properties:
        proposal_id:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Correlation fingerprint for detecting accidental request drift; it is not authorization or proof of confirmation.
        action:
          $ref: '#/components/schemas/AssistantAction'
        project_id:
          type: string
          format: uuid
        expected_etag:
          type: string
        patch:
          $ref: '#/components/schemas/AssistantProjectPatch'
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/AssistantProjectPatchChange'
    AssistantNewProjectDraftProposal:
      type: object
      additionalProperties: false
      required: [proposal_id, action, project]
      properties:
        proposal_id:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Correlation fingerprint for detecting accidental response drift; it is not authorization or proof of persistence.
        action:
          type: string
          const: open_project_draft
        project:
          $ref: '#/components/schemas/EditableProject'
    AssistantProposal:
      oneOf:
        - $ref: '#/components/schemas/AssistantProjectPatchProposal'
        - $ref: '#/components/schemas/AssistantNewProjectDraftProposal'
      discriminator:
        propertyName: action
        mapping:
          apply_project_patch: '#/components/schemas/AssistantProjectPatchProposal'
          open_project_draft: '#/components/schemas/AssistantNewProjectDraftProposal'
    AssistantImageProjectClassification:
      type: object
      additionalProperties: false
      required: [project_type, confidence, evidence, ambiguities]
      properties:
        project_type:
          type: string
          enum: [ec2, rds, on_prem, sql_payg, unknown]
        confidence:
          type: string
          enum: [high, medium, low]
        evidence:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 240
        ambiguities:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 240
    AssistantImageResponse:
      type: object
      additionalProperties: false
      required: [answer, classification, proposal, omissions, uncertainties]
      properties:
        answer:
          type: string
        classification:
          oneOf:
            - $ref: '#/components/schemas/AssistantImageProjectClassification'
            - type: 'null'
        proposal:
          oneOf:
            - $ref: '#/components/schemas/AssistantProposal'
            - type: 'null'
        omissions:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 500
        uncertainties:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 500
    AssistantActionRequest:
      type: object
      additionalProperties: false
      required: [proposal_id, action, project_id, expected_etag, patch]
      properties:
        proposal_id:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        action:
          $ref: '#/components/schemas/AssistantAction'
        project_id:
          type: string
          format: uuid
        expected_etag:
          type: string
        patch:
          $ref: '#/components/schemas/AssistantProjectPatch'
    Region:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    RegionCatalog:
      type: object
      required: [status, currency, retrieved_at, source_urls, warnings, items]
      properties:
        status:
          $ref: '#/components/schemas/ResolutionStatus'
        currency:
          type: string
          const: USD
        retrieved_at:
          type: [string, 'null']
          format: date-time
        source_urls:
          type: array
          items:
            type: string
            format: uri
        warnings:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Region'
    Ec2Instance:
      type: object
      required: [instance_type, source_vcpu, memory_gib]
      properties:
        instance_type:
          type: string
        source_vcpu:
          type: integer
          minimum: 1
        memory_gib:
          $ref: '#/components/schemas/Decimal'
    RdsInstance:
      $ref: '#/components/schemas/Ec2Instance'
    RdsOption:
      type: object
      required: [deployment, commercial_term, storage_class]
      properties:
        deployment:
          type: string
          enum: [single_az, multi_az]
        commercial_term:
          type: string
        storage_class:
          type: string
    EbsType:
      type: object
      required: [key, label, price_required, pricing_available]
      properties:
        key:
          type: string
          enum: [gp3, io2, ephemeral]
        label:
          type: string
        price_required:
          type: boolean
        pricing_available:
          type: boolean
    Ec2InstanceCatalog:
      allOf:
        - $ref: '#/components/schemas/CatalogMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Ec2Instance'
    RdsInstanceCatalog:
      allOf:
        - $ref: '#/components/schemas/CatalogMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RdsInstance'
    RdsOptionCatalog:
      allOf:
        - $ref: '#/components/schemas/CatalogMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RdsOption'
    EbsTypeCatalog:
      allOf:
        - $ref: '#/components/schemas/CatalogMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EbsType'
    CatalogMetadata:
      type: object
      required: [status, currency, retrieved_at, source_urls, warnings]
      properties:
        status:
          $ref: '#/components/schemas/ResolutionStatus'
        currency:
          type: string
          const: USD
        retrieved_at:
          type: [string, 'null']
          format: date-time
        source_urls:
          type: array
          items:
            type: string
            format: uri
