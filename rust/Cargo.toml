[package]
name = "azure-sql-tco"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
base64 = "=0.23.1"
rust_decimal = { version = "=1.42.1", features = ["serde-str"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.0", features = ["compression-gzip", "limit", "request-id", "set-header", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true