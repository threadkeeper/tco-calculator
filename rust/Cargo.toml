[package]
name = "azure-sql-tco"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
azure_core = { version = "=1.1.0", default-features = false }
azure_data_cosmos = { version = "=0.37.1", default-features = false, features = ["reqwest", "rustls"] }
azure_identity = { version = "=1.0.0", default-features = false }
base64 = "=0.23.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["gzip", "json", "query", "rustls"] }
rust_decimal = { version = "=1.42.1", features = ["serde-str"] }
futures = { version = "=0.3.33", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"
time = { version = "=0.3.55", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.7.0", features = ["compression-gzip", "set-header", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true